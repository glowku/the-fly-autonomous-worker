name: fly-commit
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Nombre de commits'
        default: '25'
        required: false
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: fly-commit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r requirements.txt

      - name: Run commit worker
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          python -c "
          from bot.workers import run_commit_batch
          import os
          n = int('${{ inputs.batch }}' or '25')
          results = run_commit_batch(n=n)
          ok = sum(1 for r in results if r['status']=='ok')
          print(f'✅ {ok}/{len(results)} commits réussis')
          "

      - name: Self re-trigger
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          sleep 15
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fly-commit.yml/dispatches" \
            -d '{"ref":"main","inputs":{"batch":"25"}}'