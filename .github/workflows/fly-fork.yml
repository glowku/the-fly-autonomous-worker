name: fly-fork
on:
  workflow_dispatch:
    inputs:
      count:
        default: '3'
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fly-fork
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fork worker
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          python -u -c "
          from bot.workers import run_fork_batch
          results = run_fork_batch(n=int('${{ inputs.count }}' or '3'))
          ok = sum(1 for r in results if r['status']=='ok')
          print(f'✅ {ok}/{len(results)} PRs créées')
          "